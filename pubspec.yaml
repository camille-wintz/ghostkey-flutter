name: ghostkey
description: Ghostkey — the writing app, on a phone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  lucide_icons_flutter: ^3.1.19
  markdown: ^7.3.1
  camera: ^0.12.1
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  image: ^4.9.2
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader_600SemiBold.ttf
          weight: 600
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Spectral_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral_600SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
